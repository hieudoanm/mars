[package]
name = "mars"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
test = false

[[bin]]
name = "mars"
path = "src/main.rs"

[dependencies]
mars-core = { path = "../mars-core" }
mars-document = { path = "../mars-document" }
mars-runtime = { path = "../mars-runtime" }
mars-jupyter = { path = "../mars-jupyter" }
mars-renderer = { path = "../mars-renderer" }
mars-kernel = { path = "../mars-kernel" }
mars-mcp = { path = "../mars-mcp" }
mars-protocol = { path = "../mars-protocol" }
mars-lab = { path = "../mars-lab" }
serde.workspace = true
serde_json.workspace = true
dissimilar = "=1.0.11"
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[features]
experimental-evcxr = ["mars-kernel/experimental-evcxr"]
