name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-check:
    name: CLI check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3

      # src-tauri is a workspace member, so workspace-wide cargo commands
      # compile the Tauri backend and need its system libraries on Linux.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Mirrors `make coverage` (same package set, filename ignores, and
      # fail-under gates) and additionally emits lcov + HTML reports.
      - name: Rust coverage
        run: |
          run_coverage() {
            cargo llvm-cov \
              -p mars-core -p mars-document -p mars-runtime -p mars-runtime-evcxr \
              -p mars-runtime-julia -p mars-runtime-python -p mars-runtime-r \
              -p mars-runtime-cpp -p mars-protocol -p mars-kernel -p mars-mcp \
              -p mars-jupyter -p mars-renderer -p mars-lsp -p mars \
              --all-targets \
              --ignore-filename-regex 'src/bin/(benchmark|runtime_benchmark)\.rs|mars-runtime-evcxr/src/(backend|session|context)\.rs' \
              --fail-under-lines 80 --fail-under-functions 80 \
              --lcov --output-path lcov.info
          }
          # A killed test child can leave a truncated profraw that fails
          # llvm-profdata merge — clean first and retry once on failure.
          cargo llvm-cov clean
          run_coverage || {
            echo '::warning::coverage run failed; cleaning profraw and retrying once'
            cargo llvm-cov clean
            run_coverage
          }
          # `report` reuses the profraw from the run above — no re-test.
          cargo llvm-cov report --html --output-dir coverage/html

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage/html/
          if-no-files-found: warn

      - name: Upload Rust coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5.5.5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-check` job.
    if: github.event_name != 'pull_request'
    needs: cli-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build release binary
        run: cargo build --release -p mars --locked

      # Rename to the Rust target triple so the three OS artifacts don't
      # collide when merged into the release assets.
      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/mars mars-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/mars mars-aarch64-apple-darwin ;;
            windows-latest) mv target/release/mars.exe mars-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-cli-${{ matrix.os }}
          path: mars-*
          if-no-files-found: error

  desktop-check:
    name: Desktop check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm --filter @mars/desktop run typecheck

      - name: Lint
        run: pnpm --filter @mars/desktop run lint

      - name: Test
        run: pnpm --filter @mars/desktop run test:coverage

      - name: Upload desktop coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-coverage
          path: packages/desktop/coverage/
          if-no-files-found: warn

      - name: Upload desktop coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5.5.5
        with:
          files: packages/desktop/coverage/lcov.info
          flags: desktop
          fail_ci_if_error: false

  desktop-e2e:
    name: Desktop e2e (tauri-driver)
    runs-on: ubuntu-latest
    needs: desktop-check
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libglib2.0-dev libwebkit2gtk-4.1-dev libxdo-dev xvfb
          # WebKitWebDriver package was renamed in newer Ubuntu releases
          sudo apt-get install -y webkitgtk-webdriver || \
            sudo apt-get install -y webkit2gtk-driver

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Tauri app (no bundles)
        working-directory: packages/desktop
        run: pnpm exec tauri build --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run tauri-driver e2e suite
        working-directory: packages/desktop
        run: xvfb-run -a pnpm run test:e2e:tauri

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-e2e-artifacts
          path: packages/desktop/e2e/artifacts
          if-no-files-found: ignore

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release bundles are only needed for the master-branch release job;
    # PRs are covered by the `desktop-check` job.
    if: github.event_name != 'pull_request'
    needs: desktop-check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libglib2.0-dev libwebkit2gtk-4.1-dev

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles dmg

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        working-directory: target/release/bundle/macos
        run: zip -r "Project Mars.app.zip" "Project Mars.app"

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Project Mars.app.zip
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  landing-build:
    name: Landing - Build Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm --filter @mars/landing run typecheck

      - name: Lint
        run: pnpm --filter @mars/landing run lint

      - name: Test
        run: pnpm --filter @mars/landing run test

      - name: Build
        run: pnpm --filter @mars/landing run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy Page
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  extension-vscode:
    name: Extension - VS Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm --filter mars-vscode run typecheck

      - name: Lint
        run: pnpm --filter mars-vscode run lint

      - name: Test
        run: pnpm --filter mars-vscode run test

      - name: Build
        run: pnpm --filter mars-vscode run build

      - name: Package VSIX
        run: pnpm --filter mars-vscode run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-vscode-vsix
          path: extensions/vscode/vsix/*.vsix
          if-no-files-found: error

  extension-zed:
    name: Extension - Zed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt -p mars-zed -- --check

      - name: Clippy
        run: cargo clippy -p mars-zed --all-targets -- -D warnings

      - name: Test
        run: cargo test -p mars-zed

      # rust-toolchain.toml pins the toolchain, so the dtolnay `targets` input
      # above installs the target for `stable`, not for the pinned channel.
      - name: Install WASM target
        run: rustup target add wasm32-wasip1

      - name: Build WASM extension
        run: cargo build --release --target wasm32-wasip1 -p mars-zed

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-zed-wasm
          path: target/wasm32-wasip1/release/mars_zed.wasm
          if-no-files-found: error

  extension-jetbrains:
    name: Extension - JetBrains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('extensions/jetbrains/**/*.gradle*', 'extensions/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build plugin
        working-directory: extensions/jetbrains
        run: ./gradlew buildPlugin --no-daemon --console=plain

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-jetbrains-plugin
          path: extensions/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  release:
    name: Release
    needs:
      [
        cli-build,
        desktop-build,
        extension-vscode,
        extension-zed,
        extension-jetbrains,
      ]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mars-cli-*
          path: dist
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mars-desktop-*
          path: dist
          merge-multiple: true

      - name: Download VS Code extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mars-vscode-vsix
          path: dist

      - name: Download Zed extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mars-zed-wasm
          path: dist

      - name: Download JetBrains extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mars-jetbrains-plugin
          path: dist

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: Project Mars (latest)
          body_path: RELEASE.md
          files: dist/**
