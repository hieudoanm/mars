name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  PNPM_VERSION: "12.18.0"

jobs:
  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Build release binary
        run: cargo build --release -p mars --locked

      # Rename to the Rust target triple so the three OS artifacts don't
      # collide when merged into the release assets.
      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/mars mars-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/mars mars-aarch64-apple-darwin ;;
            windows-latest) mv target/release/mars.exe mars-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-cli-${{ matrix.os }}
          path: mars-*
          if-no-files-found: error

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libglib2.0-dev libwebkit2gtk-4.1-dev

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles dmg

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        working-directory: target/release/bundle/macos
        run: zip -r Mars.app.zip Mars.app

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Mars.app.zip
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-desktop-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  landing-build:
    name: Landing build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm --filter @mars/landing run lint

      - name: Type check
        run: pnpm --filter @mars/landing run check

      - name: Test
        run: pnpm --filter @mars/landing run test

      - name: Build
        run: pnpm --filter @mars/landing run build

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Deploy landing site
    needs: landing-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  extension-vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm --filter mars-vscode run check

      - name: Lint
        run: pnpm --filter mars-vscode run lint

      - name: Test
        run: pnpm --filter mars-vscode run test

      - name: Build
        run: pnpm --filter mars-vscode run build

      - name: Package VSIX
        run: pnpm --filter mars-vscode run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-vscode-vsix
          path: extensions/vscode/vsix/*.vsix
          if-no-files-found: error

  extension-zed:
    name: Zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-zed-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-zed-

      - name: Format
        run: cargo fmt -p mars-zed -- --check

      - name: Clippy
        run: cargo clippy -p mars-zed --all-targets -- -D warnings

      - name: Test
        run: cargo test -p mars-zed

      # rust-toolchain.toml pins the toolchain, so the dtolnay `targets` input
      # above installs the target for `stable`, not for the pinned channel.
      - name: Install WASM target
        run: rustup target add wasm32-wasip1

      - name: Build WASM extension
        run: cargo build --release --target wasm32-wasip1 -p mars-zed

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-zed-wasm
          path: target/wasm32-wasip1/release/mars_zed.wasm
          if-no-files-found: error

  extension-jetbrains:
    name: JetBrains extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8.0.LTS"

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('extensions/jetbrains/**/*.gradle*', 'extensions/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build plugin
        working-directory: extensions/jetbrains
        run: ./gradlew buildPlugin --no-daemon --console=plain

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mars-jetbrains-plugin
          path: extensions/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  releases:
    name: Release
    needs:
      [
        cli-build,
        desktop-build,
        extension-vscode,
        extension-zed,
        extension-jetbrains,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mars-cli-*
          path: dist
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mars-desktop-*
          path: dist
          merge-multiple: true

      - name: Download VS Code extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mars-vscode-vsix
          path: dist

      - name: Download Zed extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mars-zed-wasm
          path: dist

      - name: Download JetBrains extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: mars-jetbrains-plugin
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: v0.0.1-${{ github.run_number }}
          name: Mars ${{ github.ref_name }} (${{ github.run_number }})
          generate_release_notes: true
          files: dist/*
