<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mars file logo</title>
  <desc id="desc">The Mars planet mark without the notebook symbol.</desc>
  <defs>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset=".48" stop-color="#e34d3d"/>
      <stop offset="1" stop-color="#9f2631"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#080b12" flood-opacity=".35"/>
    </filter>
    <clipPath id="planetClip">
      <circle cx="256" cy="256" r="142"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#11151d"/>
  <circle cx="256" cy="256" r="142" fill="url(#planet)" filter="url(#shadow)"/>
  <g clip-path="url(#planetClip)" fill="none" stroke="#ff9a72" stroke-linecap="round" opacity=".3">
    <path d="M92 218c81-45 177-55 311-15" stroke-width="18"/>
    <path d="M104 330c73-39 170-54 286-31" stroke-width="13"/>
    <path d="M179 106c-25 55-25 123 11 196s96 117 174 132" stroke-width="11"/>
    <path d="M112 270c51 17 111 19 176 3 62-15 115-45 151-88" stroke-width="8"/>
  </g>
</svg>
