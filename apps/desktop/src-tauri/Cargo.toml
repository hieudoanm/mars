[package]
name = "mars-desktop"
version = "0.1.0"
description = "Mars interactive notebook"
authors = ["Mars contributors"]
edition = "2024"

[lib]
name = "mars_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
mars-kernel = { path = "../../../crates/mars-kernel" }
mars-document = { path = "../../../crates/mars-document" }
mars-protocol = { path = "../../../crates/mars-protocol" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
thiserror.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
