[project]
name = "mars-jupyter-examples"
version = "0.1.0"
description = "Jupyter notebook examples for Mars"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]
