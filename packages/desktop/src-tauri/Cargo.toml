[package]
name = "mars-tauri"
version = "0.0.1"
description = "Project Mars interactive notebook"
authors = ["Project Mars contributors"]
edition = "2024"

[lib]
name = "mars_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
mars-core = { path = "../../../crates/mars-core" }
mars-kernel = { path = "../../../crates/mars-kernel" }
mars-document = { path = "../../../crates/mars-document" }
mars-jupyter = { path = "../../../crates/mars-jupyter" }
mars-protocol = { path = "../../../crates/mars-protocol" }
mars-renderer = { path = "../../../crates/mars-renderer" }
mars-runtime = { path = "../../../crates/mars-runtime" }
mars-lsp = { path = "../../../crates/mars-lsp" }
mars-lab = { path = "../../../crates/mars-lab" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
thiserror.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
experimental-evcxr = ["mars-kernel/experimental-evcxr"]
