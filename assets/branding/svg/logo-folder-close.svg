<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Mars folder logo (closed)</title>
  <desc id="desc">A closed orange folder with the Mars planet mark at the bottom right.</desc>
  <defs>
    <linearGradient id="folderBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa14f"/>
      <stop offset=".55" stop-color="#f57f1d"/>
      <stop offset="1" stop-color="#d95f0e"/>
    </linearGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset=".48" stop-color="#e34d3d"/>
      <stop offset="1" stop-color="#9f2631"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
