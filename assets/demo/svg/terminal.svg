  <text x="640" y="47" text-anchor="middle" font-family="Menlo, monospace" font-size="17" fill="#8a8a8a">mars — zsh</text>
  <g font-family="Menlo, monospace" font-size="20"><text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">mars --version</tspan></text>  <text x="44" y="158" fill="#c9a06a">mars 0.0.1</text>  </g>  <g font-family="Menlo, monospace" font-size="20"><text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">mars new analysis.mars</tspan></text>  <text x="44" y="222" fill="#9ca3af">Created analysis.mars — 3 cells</text>  </g>  <g font-family="Menlo, monospace" font-size="20"><text x="44" y="254"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">mars run analysis.mars</tspan></text>  <text x="44" y="286" fill="#e5e5e5">[1] let greeting = "Hello from Mars!";</text>  <text x="44" y="318" fill="#e5e5e5">[2] greeting → "Hello from Mars!"</text>  <text x="44" y="350" fill="#e5e5e5">[3] 2 + 2 → 4</text>  <text x="44" y="382" fill="#9ca3af">Executed 3 cells in 1.24s · kernel: Idle</text>  </g>  <g font-family="Menlo, monospace" font-size="20"><text x="44" y="414"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">mars inspect analysis.mars</tspan></text>  <text x="44" y="446" fill="#9ca3af">format v1 · language: rust · 3 cells</text>  </g>  <g font-family="Menlo, monospace" font-size="20"><text x="44" y="478"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">mars export analysis.mars html out/</tspan></text>  <text x="44" y="510" fill="#7dd3a8">Wrote out/analysis.html (24 KB)</text>  </g>  <g font-family="Menlo, monospace" font-size="20"><text x="44" y="542"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">mars kernel restart</tspan></text>  <text x="44" y="574" fill="#9ca3af">Kernel restarted — variables cleared</text>  </g></svg>
