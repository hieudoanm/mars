[workspace]
members = [
    "crates/mars-core",
    "crates/mars-document",
    "crates/mars-runtime",
    "crates/mars-runtime-evcxr",
    "crates/mars-runtime-julia",
    "crates/mars-runtime-python",
    "crates/mars-runtime-r",
    "crates/mars-runtime-cpp",
    "crates/mars-runtime-sql",
    "crates/mars-protocol",
    "crates/mars-kernel",
    "crates/mars-mcp",
    "crates/mars-jupyter",
    "crates/mars-renderer",
    "crates/mars-lsp",
    "crates/mars-cli",
    "crates/mars-lab",
    "packages/desktop/src-tauri",
    "extensions/zed",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
libc = "=0.2.191"
uuid = { version = "=1.29.3", features = ["serde", "v4"] }
pulldown-cmark = "=0.13.6"
ammonia = "=4.2.5"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["serde"] }
linfa = "=0.8.1"
linfa-clustering = "=0.8.1"
ndarray = "=0.17.2"
onnx-protobuf = "=0.2.3"
polars = { version = "=0.55.2", features = ["lazy", "csv", "temporal", "strings", "dtype-full"] }
polars-lazy = "=0.55.2"
protobuf = "=3.7.2"
rand = "=0.10.4"
rand08 = { package = "rand", version = "=0.8.6" }
regex = "=1.13.1"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# onnx-protobuf 0.2.3 pins a protobuf-codegen 3.4 version check that rejects
# protobuf 3.7.x; vendored copy relaxes the check to the workspace protobuf.
[patch.crates-io]
onnx-protobuf = { path = "vendor/onnx-protobuf" }
